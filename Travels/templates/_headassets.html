{% load static %}
<link rel="stylesheet" href="{% static 'css/style.css' %}">
<link rel="stylesheet" href="{% static 'css/responsive.css' %}">
<link rel="stylesheet" href="{% static 'css/animations.css' %}">

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<style>
    /* Google Translate dropdown styling */
    .google-translate {
        min-width: 130px;
        color: rgba(255, 255, 255, 0.9);
        transition: color 0.4s var(--ease);
    }

    .google-translate i {
        color: inherit;
        font-size: 1.1rem;
        transition: color 0.4s var(--ease);
    }

    /* Scrolled or Solid navbar state */
    .navbar-dreamland.scrolled .google-translate,
    .navbar-dreamland.solid .google-translate {
        color: var(--color-ink) !important;
    }

    .goog-te-gadget {
        font-family: var(--font-body) !important;
        font-size: 0 !important;
    }

    .goog-te-gadget .goog-te-combo {
        margin: 0 0 0 32px !important;
        padding: 8px 17px 8px 5px;
        border: 1.3px solid white;
        border-radius: 20px;
        background: transparent;
        color: white;
        font-family: var(--font-body) !important;
        font-size: 14px !important;
        font-weight: 600;
        outline: none;
        cursor: pointer;
        transition: all 0.4s var(--ease);
    }

    .goog-te-gadget .goog-te-combo:hover {
        border-color: rgba(255, 255, 255, 0.7);
        background: rgba(255, 255, 255, 0.05);
    }

    /* Scrolled or Solid navbar dropdown style */
    .navbar-dreamland.scrolled .goog-te-gadget .goog-te-combo,
    .navbar-dreamland.solid .goog-te-gadget .goog-te-combo {
        border-color: rgba(15, 76, 129, 0.25);
        color: var(--color-ink) !important;
    }

    .navbar-dreamland.scrolled .goog-te-gadget .goog-te-combo:hover,
    .navbar-dreamland.solid .goog-te-gadget .goog-te-combo:hover {
        border-color: var(--color-primary);
        background: rgba(15, 76, 129, 0.04);
    }

    /* Admin topbar state styling */
    .dash-topbar .google-translate {
        color: var(--color-ink) !important;
    }

    .dash-topbar .goog-te-gadget .goog-te-combo {
        border-color: rgba(15, 76, 129, 0.25) !important;
        color: var(--color-ink) !important;
    }

    .dash-topbar .goog-te-gadget .goog-te-combo:hover {
        border-color: var(--color-primary) !important;
        background: rgba(15, 76, 129, 0.04) !important;
    }

    .goog-te-gadget .goog-te-combo option {
        color: var(--color-ink);
        background: #fff;
        font-weight: 500;
    }

    /* Google Translate notification/banner completely hide */
    iframe.skiptranslate,
    .goog-te-banner-frame,
    .goog-te-banner-frame.skiptranslate,
    .goog-te-banner,
    #goog-gt-tt,
    .goog-te-balloon-frame {
        display: none !important;
        visibility: hidden !important;
        height: 0 !important;
        opacity: 0 !important;
    }

    body {
        top: 0 !important;
        position: relative !important;
    }

    html,
    body {
        margin-top: 0 !important;
        top: 0 !important;
    }

    /* Google Translate popup/tooltip hide */
    .goog-tooltip,
    .goog-tooltip:hover,
    .goog-text-highlight {
        display: none !important;
        background: transparent !important;
        box-shadow: none !important;
    }

    /* Google branding hide */
    .goog-logo-link,
    .goog-te-gadget span {
        display: none !important;
    }
</style>

<script>
    // Keep track of whether the translation widget has been successfully initialized
    window.googleTranslateInitialized = false;

    function initGoogleTranslate() {
        if (window.googleTranslateInitialized) return;

        let element = document.getElementById('google_translate_element');
        if (!element) {
            // Dynamic injection for admin pages if not already injected
            const actions = document.querySelector('.admin-top-actions');
            if (actions) {
                const wrapper = document.createElement('div');
                wrapper.className = 'google-translate d-flex align-items-center me-3';
                wrapper.innerHTML = `
                    <div id="google_translate_element"></div>
                `;
                actions.insertBefore(wrapper, actions.firstChild);
                element = document.getElementById('google_translate_element');
            }
        }

        // Initialize Google Translate if the element is present in the DOM and the library is loaded
        if (element && window.google && google.translate && google.translate.TranslateElement) {
            new google.translate.TranslateElement({
                pageLanguage: 'en',
                includedLanguages: 'en,hi,gu',
                autoDisplay: false
            }, 'google_translate_element');
            window.googleTranslateInitialized = true;
        }
    }

    function googleTranslateElementInit() {
        initGoogleTranslate();
    }

    // Hide Google Translate banner, prevent body shifting, and customize dropdown
    function manageGoogleTranslate() {
        // Try initializing if it hasn't succeeded yet
        if (!window.googleTranslateInitialized) {
            initGoogleTranslate();
        }

        // Hide banners
        const banners = document.querySelectorAll('.goog-te-banner-frame, iframe.skiptranslate, .goog-te-banner, #goog-gt-tt, .goog-te-balloon-frame');
        banners.forEach(banner => {
            banner.style.setProperty('display', 'none', 'important');
            banner.style.setProperty('visibility', 'hidden', 'important');
            banner.style.setProperty('height', '0', 'important');
            banner.style.setProperty('opacity', '0', 'important');
        });

        document.body.style.setProperty('top', '0px', 'important');
        document.documentElement.style.setProperty('margin-top', '0px', 'important');

        // Customize dropdown: Change "Select Language" placeholder option to "English"
        const select = document.querySelector('.goog-te-combo');
        if (select) {
            const firstOption = select.options[0];
            if (firstOption && (firstOption.value === "" || firstOption.value === undefined)) {
                if (firstOption.textContent !== "English") {
                    firstOption.textContent = "English";
                }
            }
        }
    }

    setInterval(manageGoogleTranslate, 150);

    // Also run on DOMContentLoaded for quick injection
    document.addEventListener('DOMContentLoaded', () => {
        manageGoogleTranslate();
    });
</script>

<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
