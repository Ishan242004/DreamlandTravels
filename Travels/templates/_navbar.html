<!-- Navbar -->
<nav class="navbar navbar-expand-lg fixed-top navbar-dreamland{% if solid %} solid{% endif %}">
    <div class="container">
        <a class="navbar-brand" href="{% url 'index' %}">
            <span class="brand-mark"><i class="bi bi-compass"></i></span>
            Dreamland Travels
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <i class="bi bi-list"></i>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav mx-auto align-items-lg-center gap-lg-1">
                <li class="nav-item"><a class="nav-link{% if active == 'home' %} active{% endif %}"
                        href="{% url 'index' %}">Home</a></li>
                <li class="nav-item"><a class="nav-link{% if active == 'about' %} active{% endif %}"
                        href="{% url 'about' %}">About</a></li>
                <li class="nav-item"><a class="nav-link{% if active == 'packages' %} active{% endif %}"
                        href="{% url 'packages' %}">Packages</a></li>
                <li class="nav-item"><a class="nav-link{% if active == 'contact' %} active{% endif %}"
                        href="{% url 'contact' %}">Contact</a></li>
                <li class="nav-item"><a class="nav-link{% if active == 'feedback' %} active{% endif %}"
                        href="{% url 'feedback' %}">Feedback</a></li>
            </ul>
            <div class="d-flex align-items-center gap-2">
                <!-- Language Selector -->
                <div class="google-translate d-flex align-items-center">
                    <div id="google_translate_element"></div>
                </div>

                {% if request.session.admin %}

                <a href="{% url 'admin_dashboard' %}" class="btn btn-nav-outline btn-sm">
                    <i class="bi bi-speedometer2 me-1"></i> Admin Dashboard
                </a>
                

                {% elif user.is_authenticated %}

                    <div class="dropdown profile-dropdown">
                        <button class="nav-link" type="button" data-bs-toggle="dropdown" aria-expanded="false">

                            {% if user.userprofile.photo %}
                            <img src="{{ user.userprofile.photo.url }}" alt="{{ user.first_name }}"
                                class="profile-avatar">
                            {% else %}
                            <i class="bi bi-person-circle"></i>
                            {% endif %}

                            <span class="d-none d-lg-inline">
                                {{ user.first_name }}
                            </span>

                            <i class="bi bi-chevron-down small"></i>

                        </button>

                        <ul class="dropdown-menu dropdown-menu-end profile-dropdown-menu">

                            <li>
                                <a class="dropdown-item" href="{% url 'dashboard_profile' %}">
                                    <i class="bi bi-person-circle me-2"></i>
                                    My Profile
                                </a>
                            </li>

                            <li>
                                <a class="dropdown-item" href="{% url 'dashboard_bookings' %}">
                                    <i class="bi bi-airplane me-2"></i>
                                    My Bookings
                                </a>
                            </li>

                            <li>
                                <a class="dropdown-item" href="{% url 'dashboard_edit_profile' %}">
                                    <i class="bi bi-pencil-square me-2"></i>
                                    Edit Profile
                                </a>
                            </li>

                            <li>
                                <hr class="dropdown-divider">
                            </li>

                            <li>
                                <a class="dropdown-item text-danger" href="{% url 'user_logout' %}">
                                    <i class="bi bi-box-arrow-right me-2"></i>
                                    Logout
                                </a>
                            </li>

                        </ul>

                    </div>
                    {% else %}
                    <a href="{% url 'login' %}" class="btn btn-nav-outline btn-sm">
                        Login
                    </a>
                    <a href="{% url 'register' %}" class="btn btn-nav-cta btn-sm">
                        Register
                    </a>
                    {% endif %}
                </div>
            </div>
        </div>
</nav>

        (function (c, l, a, r, i, t, y) {
            c[a] = c[a] || function () { (c[a].q = c[a].q || []).push(arguments) };
